[package]
name = "cse_server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = "1.3.0"
log = "0.4"
cse_common = { path = "../cse_common" }
serde = { version = "1.0.219", features = ["derive"] }

[profile.release]
debug = true
